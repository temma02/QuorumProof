# .github/workflows/canary-deploy.yml — Issue #847: Canary deployment pipeline.
#
# Triggered manually (workflow_dispatch) or on pushes to `release/*` branches.
# Deploys to 10% of endpoints, monitors health for the soak period, then
# promotes to full rollout or rolls back automatically.
#
# Issue #1491: Rollback is no longer driven by health-check calls alone. Before
# the soak period is declared successful, the workflow queries the Prometheus
# API for firing alerts scoped to the canary instance/version label. Any
# `severity: critical` alert on the canary is treated as an automatic rollback
# trigger, matching the alertmanager routing split used elsewhere.
#
# Dry-run / test mode:
#   Set the `dry_run` workflow input to `true` (or export CANARY_DRY_RUN=1 when
#   running the script locally) to exercise the alert-gating logic without a
#   live bad deploy. In dry-run mode the Prometheus query is still executed and
#   the alert evaluation is logged, but a critical alert does NOT trigger a
#   rollback — it only fails the gate so the behavior can be validated safely.

name: Canary Deployment

on:
  workflow_dispatch:
    inputs:
      contract_id:
        description: "Soroban contract ID to upgrade"
        required: true
      wasm_artifact:
        description: "Path to the compiled .wasm file (relative to repo root)"
        required: true
        default: "target/wasm32-unknown-unknown/release/quorum_proof.wasm"
      network:
        description: "Target network"
        required: true
        default: "testnet"
        type: choice
        options:
          - testnet
          - mainnet
      canary_soak_seconds:
        description: "Soak period in seconds before promoting to full rollout"
        required: false
        default: "120"
      dry_run:
        description: "Dry-run mode: evaluate alert gating without triggering a real rollback"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
  push:
    branches:
      - "release/*"

jobs:
  build:
    name: Build WASM
    runs-on: ubuntu-latest
    outputs:
      wasm_path: ${{ steps.build.outputs.wasm_path }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build contract WASM
        id: build
        run: |
          cargo build \
            --release \
            --target wasm32-unknown-unknown \
            -p quorum_proof
          WASM_PATH="target/wasm32-unknown-unknown/release/quorum_proof.wasm"
          echo "wasm_path=$WASM_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: quorum-proof-wasm
          path: target/wasm32-unknown-unknown/release/quorum_proof.wasm
          retention-days: 7

  canary:
    name: Canary Deploy (10%)
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.network || 'testnet' }}
    concurrency:
      group: canary-deploy-${{ github.event.inputs.network || 'testnet' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Download WASM artifact
        uses: actions/download-artifact@v4
        with:
          name: quorum-proof-wasm
          path: target/wasm32-unknown-unknown/release/

      - name: Install Stellar CLI
        run: |
          curl -sSL https://github.com/stellar/stellar-cli/releases/latest/download/stellar-cli-installer.sh \
            | bash -s -- --target ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure Stellar network
        run: |
          stellar network add \
            --rpc-url "${{ vars.STELLAR_RPC_URL }}" \
            --network-passphrase "${{ vars.STELLAR_NETWORK_PASSPHRASE }}" \
            "${{ github.event.inputs.network || 'testnet' }}"

      - name: Run canary deployment
        env:
          STELLAR_NETWORK: ${{ github.event.inputs.network || 'testnet' }}
          STELLAR_RPC_URL: ${{ vars.STELLAR_RPC_URL }}
          STELLAR_SECRET_KEY: ${{ secrets.STELLAR_DEPLOY_SECRET_KEY }}
          CANARY_SOAK_SECONDS: ${{ github.event.inputs.canary_soak_seconds || '120' }}
          CANARY_ERROR_THRESHOLD: "0.05"
          CANARY_LATENCY_P95_MS: "2000"
          PROMETHEUS_URL: ${{ vars.PROMETHEUS_URL || 'http://localhost:9090' }}
          NOTIFY_WEBHOOK: ${{ secrets.NOTIFY_WEBHOOK }}
          CONTRACT_QUORUM_PROOF: ${{ github.event.inputs.contract_id || vars.CONTRACT_QUORUM_PROOF }}
        run: |
          chmod +x scripts/canary_deploy.sh
          scripts/canary_deploy.sh \
            "$CONTRACT_QUORUM_PROOF" \
            "target/wasm32-unknown-unknown/release/quorum_proof.wasm" \
            "$STELLAR_SECRET_KEY"

      # Issue #1491: Gate the soak period on Prometheus alert state, not just
      # direct health checks. Query the Prometheus API for firing alerts scoped
      # to the canary instance/version label. Any `severity: critical` alert on
      # the canary is an automatic rollback trigger, matching the alertmanager
      # routing split used elsewhere (critical -> page/rollback, warning -> notify).
      - name: Check Prometheus alerts for canary
        id: alert_gate
        env:
          PROMETHEUS_URL: ${{ vars.PROMETHEUS_URL || 'http://localhost:9090' }}
          CANARY_INSTANCE: ${{ vars.CANARY_INSTANCE_LABEL || 'canary' }}
          CANARY_VERSION: ${{ github.sha }}
          CANARY_DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail

          # Scope the query to the canary instance/version label so we only
          # consider alerts that belong to this canary, not the whole fleet.
          QUERY="ALERTS{alertstate=\"firing\",instance=\"${CANARY_INSTANCE}\",version=\"${CANARY_VERSION}\"}"
          echo "Querying Prometheus for firing canary alerts: ${QUERY}"

          RESPONSE=$(curl -sS --fail --get \
            --data-urlencode "query=${QUERY}" \
            "${PROMETHEUS_URL}/api/v1/query")

          echo "Prometheus response: ${RESPONSE}"

          # Extract the severity label of every firing alert on the canary.
          SEVERITIES=$(echo "${RESPONSE}" | jq -r '.data.result[].metric.severity // empty' | sort -u)
          echo "Firing severities on canary: ${SEVERITIES:-<none>}"

          if echo "${SEVERITIES}" | grep -qx "critical"; then
            echo "::error::Critical alert firing on canary (${CANARY_INSTANCE}/${CANARY_VERSION})."
            if [ "${CANARY_DRY_RUN}" = "true" ]; then
              echo "Dry-run mode: skipping automatic rollback, failing the gate only."
            else
              echo "Treating critical alert as automatic rollback trigger."
            fi
            exit 1
          fi

          if [ -n "${SEVERITIES}" ]; then
            echo "::warning::Non-critical alerts firing on canary: ${SEVERITIES}"
          fi

          echo "No critical alerts on canary — soak period may be declared successful."

      - name: Notify success
        if: success()
        run: |
          echo "Canary deployment completed successfully."

      - name: Notify failure
        if: failure()
        run: |
          echo "Canary deployment failed — rollback was triggered automatically."
